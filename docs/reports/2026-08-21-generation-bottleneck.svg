<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">三任务全量并发压测最终架构与容量</title>
  <desc id="desc">三个真实任务共47镜全部完成。图片与视频独立32并发Worker，视频峰值20在途，无429和超时。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:2}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2}.infra{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.accent{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.t{font:700 20px system-ui;fill:#0f172a}.s{font:15px system-ui;fill:#334155}.tiny{font:13px system-ui;fill:#475569}.metric{font:800 28px system-ui;fill:#047857}.edge{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.label{font:700 14px system-ui;fill:#9a3412}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#f8fafc"/>
  <text x="50" y="52" class="t" font-size="29">三任务全量并发：最终架构与容量边界</text>
  <text x="50" y="82" class="s">2026-08-21 实测 · 47/47 提示词 · 47/47 场景图 · 47/47 Seedance 视频</text>

