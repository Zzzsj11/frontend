  <text x="115" y="637" class="label">32 路持续 SLA 仍需滚动数据验证</text>

  <rect x="185" y="715" width="1030" height="82" rx="16" class="box"/>
  <text x="220" y="748" class="t">正式部署</text>
  <text x="220" y="779" class="s">DEPLOY_ENV=production ./scripts/deploy-local-images.sh  →  green backend  →  Worker 逐类 graceful drain</text>

  <text x="50" y="835" class="tiny">结论边界：已证明视频峰值20在途无429/超时；并发32是上线起配，不等于32路持续稳态承诺。</text>
