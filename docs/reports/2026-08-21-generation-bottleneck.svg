  <path d="M965 355C900 355 900 530 855 530" class="edge"/>
  <path d="M965 545H855" class="edge"/>

  <rect x="80" y="450" width="385" height="210" rx="16" class="warn"/>
  <text x="115" y="493" class="t">容量结论</text>
  <text x="115" y="536" class="metric">20 路视频实测健康</text>
  <text x="115" y="573" class="s">媒体 Worker burst：92–102 MiB/个</text>
