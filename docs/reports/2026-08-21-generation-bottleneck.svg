  <text x="738" y="307" class="t">Redis</text>
  <text x="694" y="340" class="s">唤醒 / 事件 / 热状态</text>
  <path d="M565 200H650" class="edge"/>
  <path d="M565 237C610 237 610 315 650 315" class="edge dash"/>

  <rect x="990" y="80" width="340" height="130" rx="16" class="ok"/>
  <text x="1044" y="122" class="t">Storyboard Worker × 2</text>
  <text x="1050" y="158" class="metric">47 / 47</text>
  <text x="1160" y="158" class="s">逐镜提示词成功</text>
