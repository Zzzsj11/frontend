services:
  frontend:
    image: ${REGISTRY:?set REGISTRY}/mv-agent-frontend:${RELEASE_VERSION:?set RELEASE_VERSION}
    build: !reset null
  backend:
    image: ${REGISTRY:?set REGISTRY}/mv-agent-backend:${RELEASE_VERSION:?set RELEASE_VERSION}
    build: !reset null
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  postgres:
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  redis:
    ports: !reset []
