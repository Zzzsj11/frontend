services:
  frontend:
    image: ${REGISTRY:?set REGISTRY}/mv-agent-frontend:${RELEASE_VERSION:?set RELEASE_VERSION}
    build: !reset null
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  backend:
    image: ${REGISTRY:?set REGISTRY}/mv-agent-backend:${RELEASE_VERSION:?set RELEASE_VERSION}
    build: !reset null
    secrets:
      - runtime_secrets
    environment:
      APP_ENV: production
      JWT_SECRET: ''
      DATABASE_URL: ''
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mvagent}
      POSTGRES_DB: ${POSTGRES_DB:-mvagent}
      JOB_EXECUTION_MODE: ${JOB_EXECUTION_MODE:-inline}
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
  worker-media:
    image: ${REGISTRY:?set REGISTRY}/mv-agent-backend:${RELEASE_VERSION:?set RELEASE_VERSION}
    build: !reset null
    secrets:
      - runtime_secrets
    environment:
      APP_ENV: production
      JWT_SECRET: ''
      DATABASE_URL: ''
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mvagent}
      POSTGRES_DB: ${POSTGRES_DB:-mvagent}
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 4G
  worker-export:
    image: ${REGISTRY:?set REGISTRY}/mv-agent-backend:${RELEASE_VERSION:?set RELEASE_VERSION}
    build: !reset null
    secrets:
      - runtime_secrets
    environment:
      APP_ENV: production
      JWT_SECRET: ''
      DATABASE_URL: ''
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mvagent}
      POSTGRES_DB: ${POSTGRES_DB:-mvagent}
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 6G
  worker-chat:
    image: ${REGISTRY:?set REGISTRY}/mv-agent-backend:${RELEASE_VERSION:?set RELEASE_VERSION}
    build: !reset null
    secrets:
      - runtime_secrets
    environment:
      APP_ENV: production
      JWT_SECRET: ''
      DATABASE_URL: ''
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mvagent}
      POSTGRES_DB: ${POSTGRES_DB:-mvagent}
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
  worker-storyboard:
    image: ${REGISTRY:?set REGISTRY}/mv-agent-backend:${RELEASE_VERSION:?set RELEASE_VERSION}
    build: !reset null
    secrets:
      - runtime_secrets
    environment:
      APP_ENV: production
      JWT_SECRET: ''
      DATABASE_URL: ''
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mvagent}
      POSTGRES_DB: ${POSTGRES_DB:-mvagent}
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
  postgres:
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 6G
  redis:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G

secrets:
  runtime_secrets:
    file: ./backend/.runtime_secrets.env
  postgres_password:
    file: ./backend/.postgres_password
