name: company-model-service
services:
  public-api:
    image: ${MODEL_IMAGE_REGISTRY:-local}/model-public:${VERSION:?Set an immutable version}
    build: ./public-api
    env_file: .env.public
    ports: ['127.0.0.1:8011:8011']
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3)).get('ok') is True"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  worker:
    image: ${MODEL_IMAGE_REGISTRY:-local}/model-public:${VERSION:?Set an immutable version}
    env_file: .env.public
    command: ['python', '-m', 'gateway.queue']
    restart: unless-stopped
    stop_grace_period: 120s
    cpus: 2.0
    mem_limit: 2g
    # Process liveness only; queue progress still needs an attributed smoke test.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; from pathlib import Path; os.kill(1, 0); assert b'gateway.queue' in Path('/proc/1/cmdline').read_bytes().split(bytes([0]))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  admin-api:
    image: ${MODEL_IMAGE_REGISTRY:-local}/model-admin:${VERSION:?Set an immutable version}
    build: ./admin-api
    env_file: .env.admin
    ports: ['127.0.0.1:8012:8012']
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=3)).get('ok') is True"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  admin-web:
    image: ${MODEL_IMAGE_REGISTRY:-local}/model-admin-web:${VERSION:?Set an immutable version}
    build: ./admin-web
    ports: ['127.0.0.1:5180:8080']
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  user-web:
    image: ${MODEL_IMAGE_REGISTRY:-local}/model-user-web:${VERSION:?Set an immutable version}
    build: ./user-web
    ports: ['127.0.0.1:5181:8080']
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
