name: Build release images
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
env:
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: '${{ env.REGISTRY }}', username: '${{ secrets.TCR_USERNAME }}', password: '${{ secrets.TCR_PASSWORD }}' }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: '${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mv-agent-frontend:git-${{ github.sha }}'
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: '${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mv-agent-backend:git-${{ github.sha }}'
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
