name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment: { description: Environment, type: choice, options: [staging, production], required: true }
      version: { description: 'Image tag, e.g. git-<full-sha>', required: true }
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with: { ssh-private-key: '${{ secrets.DEPLOY_SSH_KEY }}' }
      - run: ssh-keyscan -H '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts
      - run: |
          ssh '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' \
            "cd '${{ secrets.DEPLOY_PATH }}' && git fetch origin main && git merge --ff-only origin/main && DEPLOY_ENV='${{ inputs.environment }}' ./scripts/deploy.sh '${{ inputs.version }}'"
      - run: |
          PLAYWRIGHT_BASE_URL='${{ secrets.PUBLIC_URL }}' REMOTE_E2E_USERNAME='${{ secrets.E2E_USERNAME }}' REMOTE_E2E_PASSWORD='${{ secrets.E2E_PASSWORD }}' npm ci && npm run test:admin && npm run test:remote:all
