name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env: { POSTGRES_DB: mvagent_ci, POSTGRES_USER: mvagent, POSTGRES_PASSWORD: mvagent }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mvagent -d mvagent_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          { python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements*.txt' }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - run: make lint-frontend
      - run: make lint-backend
      - run: cd backend && .venv/bin/pytest -q --cov=app --cov-report=xml --cov-fail-under=55
      - run: npm test
      - run: npm run build
      - run: ./scripts/check-migrations.sh
        env:
          {
            DATABASE_URL: 'postgresql+asyncpg://mvagent:mvagent@127.0.0.1:5432/mvagent_ci',
            REDIS_URL: 'redis://127.0.0.1:6379/0',
            ALL_IN_ONE_API_KEY: 'test-only-ci-no-generation',
            ALL_IN_ONE_BASE_URL: 'http://127.0.0.1:9',
          }
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - run: npx playwright test e2e/user/digital-human-headshot.spec.ts --workers=1
      - run: npm ci --prefix model-service/admin-web && npm ci --prefix model-service/user-web
      - run: make -C model-service check
      - run: docker compose -f docker-compose.yml -f docker-compose.local-build.yml build
        env:
          LOCAL_NODE_BASE_IMAGE: docker.io/library/node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
          LOCAL_NGINX_BASE_IMAGE: docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          LOCAL_BACKEND_BASE_IMAGE: docker.io/library/python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: test-reports, path: 'backend/coverage.xml' }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - uses: docker/scout-action@481412c8b8de36d0f79e85aa382c60397466feb6
        continue-on-error: true
        with: { command: cves, only-severities: critical }
