name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: mvagent_ci, POSTGRES_USER: mvagent, POSTGRES_PASSWORD: mvagent }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mvagent -d mvagent_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements*.txt' }
      - run: npm ci
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - run: npm run lint
      - run: cd backend && .venv/bin/ruff check app tests migrations
      - run: cd backend && .venv/bin/pytest -q --cov=app --cov-report=xml --cov-fail-under=55
      - run: npm test
      - run: npm run build
      - run: ./scripts/check-migrations.sh
        env: { DATABASE_URL: 'postgresql+asyncpg://mvagent:mvagent@127.0.0.1:5432/mvagent_ci', REDIS_URL: 'redis://127.0.0.1:6379/0' }
      - run: docker compose build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-reports, path: 'backend/coverage.xml' }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=critical
      - uses: docker/scout-action@v1
        continue-on-error: true
        with: { command: cves, only-severities: critical }
