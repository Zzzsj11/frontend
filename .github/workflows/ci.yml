name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env: { POSTGRES_DB: mvagent_ci, POSTGRES_USER: mvagent, POSTGRES_PASSWORD: mvagent }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mvagent -d mvagent_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          { python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements*.txt' }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - run: make lint-frontend
      - run: make lint-backend
      - run: cd backend && .venv/bin/pytest -q --cov=app --cov-report=xml --cov-fail-under=55
      - run: npm test
      - run: npm run build
      - run: ./scripts/check-migrations.sh
        env:
          {
            DATABASE_URL: 'postgresql+asyncpg://mvagent:mvagent@127.0.0.1:5432/mvagent_ci',
            REDIS_URL: 'redis://127.0.0.1:6379/0',
            ALL_IN_ONE_API_KEY: 'test-only-ci-no-generation',
            ALL_IN_ONE_BASE_URL: 'http://127.0.0.1:9',
          }
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - run: npx playwright test e2e/user/digital-human-headshot.spec.ts --workers=1
      - run: docker compose -f docker-compose.yml -f docker-compose.local-build.yml build
        env:
          LOCAL_NODE_BASE_IMAGE: docker.io/library/node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
          LOCAL_NGINX_BASE_IMAGE: docker.io/library/nginx:1.30-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
          LOCAL_BACKEND_BASE_IMAGE: docker.io/library/python:3.12-alpine3.24@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: test-reports, path: 'backend/coverage.xml' }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
  image-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: mvagent-backend, context: backend }
          - { image: mvagent-frontend, context: . }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the image for this revision
        run: docker build -t "${{ matrix.image }}:${{ github.sha }}" "${{ matrix.context }}"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
