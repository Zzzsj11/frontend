services:
  frontend:
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:?set TLS_DOMAIN}
    ports: !override
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx-tls.conf:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}:/etc/nginx/tls:ro
      - ./.deployment/acme/.well-known/acme-challenge:/usr/share/nginx/html/.well-known/acme-challenge:ro
  backend:
    environment:
      REFRESH_COOKIE_SECURE: 'true'
