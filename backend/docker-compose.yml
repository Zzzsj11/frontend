services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mvagent
      POSTGRES_USER: mvagent
      POSTGRES_PASSWORD: mvagent
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mvagent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvagent -d mvagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - mvagent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mvagent_postgres:
  mvagent_redis:
