services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-development}
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-5173}:80'
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8000}:8000'
    env_file:
      - path: ./backend/.env.chat
        required: false
      - path: ./backend/.env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: ''
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mvagent}
      POSTGRES_DB: ${POSTGRES_DB:-mvagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvagent}
      REDIS_URL: redis://redis:6379/0
      LLM_API_MODE: ${LLM_API_MODE:-openai}
      OUTLINE_PROTOCOL_VERSION: ${OUTLINE_PROTOCOL_VERSION:-v2}
      STORAGE_BACKEND: tos
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me-at-least-32-bytes}
      JOB_EXECUTION_MODE: ${JOB_EXECUTION_MODE:-inline}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker-media:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 20m
    entrypoint: ['./worker-entrypoint.sh']
    # 视频轮询会长时间占用执行槽，必须与图片拆池，避免全量视频批次饿死图片任务。
    command: ['--kinds', 'video', '--concurrency', '${VIDEO_WORKER_CONCURRENCY:-32}']
    profiles: ['workers']
    env_file:
      - path: ./backend/.env.chat
        required: false
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ''
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mvagent}
      POSTGRES_DB: ${POSTGRES_DB:-mvagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvagent}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me-at-least-32-bytes}
      STORAGE_BACKEND: tos
      JOB_EXECUTION_MODE: worker
      RELEASE_VERSION: ${RELEASE_VERSION:-development}
      OUTLINE_PROTOCOL_VERSION: ${OUTLINE_PROTOCOL_VERSION:-v2}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
      STORYBOARD_GENERATION_CONCURRENCY: ${STORYBOARD_GENERATION_CONCURRENCY:-64}
      STORYBOARD_LINE_TIMEOUT_SECONDS: ${STORYBOARD_LINE_TIMEOUT_SECONDS:-720}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-m', 'app.worker_health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker-image:
    extends: worker-media
    command: ['--kinds', 'image', '--concurrency', '${IMAGE_WORKER_CONCURRENCY:-32}']

  worker-export:
    extends: worker-media
    stop_grace_period: 30m
    command: ['--kinds', 'export,mv_export', '--concurrency', '${EXPORT_WORKER_CONCURRENCY:-3}']

  worker-chat:
    extends: worker-media
    stop_grace_period: 2m
    command:
      ['--kinds', 'chat,prompt_optimization', '--concurrency', '${CHAT_WORKER_CONCURRENCY:-2}']

  worker-storyboard:
    extends: worker-media
    stop_grace_period: 10m
    command:
      [
        '--kinds',
        'ass_outline,general_outline,ass_segment_retry,storyboard_line,billing_reconcile',
        '--concurrency',
        '${STORYBOARD_WORKER_CONCURRENCY:-64}',
      ]

  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-mvagent}
      POSTGRES_USER: ${POSTGRES_USER:-mvagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvagent}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - mvagent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - mvagent_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mvagent_postgres:
  mvagent_redis:
