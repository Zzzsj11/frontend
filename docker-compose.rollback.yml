# 回滚旧镜像也必须跳过其无条件 Alembic 入口，数据库保留兼容的扩展迁移。
services:
  backend:
    # The previous image can predate the proxy middleware. Reuse the exact
    # launcher from the release checkout, even for that image.
    configs:
      - source: rollback_proxy_entrypoint
        target: /srv/mvagent/mv_rollback_proxy.py
    entrypoint:
      [
        'uvicorn',
        'mv_rollback_proxy:create_app',
        '--factory',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--no-proxy-headers',
      ]
  worker-media:
    command: ['--kinds', 'video', '--concurrency', '${VIDEO_WORKER_CONCURRENCY:-32}']
    healthcheck: &rollback-worker-health
      test:
        [
          'CMD',
          'python',
          '-c',
          "import asyncio,socket; from sqlalchemy import text; from app.database import session_factory; exec('async def check():\\n async with session_factory() as db:\\n  return bool(await db.scalar(text(\"SELECT 1 FROM worker_instances WHERE hostname=:host AND status=\\'running\\' AND deleted_at IS NULL AND last_heartbeat_at > CURRENT_TIMESTAMP - INTERVAL \\'60 seconds\\' LIMIT 1\"), {\"host\":socket.gethostname()}))'); raise SystemExit(0 if asyncio.run(check()) else 1)",
        ]
  worker-wan:
    healthcheck: *rollback-worker-health
  worker-seedance:
    healthcheck: *rollback-worker-health
  worker-image:
    healthcheck: *rollback-worker-health
  worker-export:
    healthcheck: *rollback-worker-health
  worker-chat:
    healthcheck: *rollback-worker-health
  worker-storyboard:
    healthcheck: *rollback-worker-health

configs:
  rollback_proxy_entrypoint:
    file: ./backend/app/proxy_entrypoint.py
