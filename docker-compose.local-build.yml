# 本机镜像加速覆盖：所有构建基础镜像与服务镜像统一走国内代理，本机不直连 docker.io。
# 服务器部署不加载本文件；镜像内容与官方一致（frontend 基础镜像以官方 sha256 digest 锁定）。
services:
  frontend:
    build:
      args:
        NODE_BASE_IMAGE: ${LOCAL_NODE_BASE_IMAGE:-docker.1ms.run/library/node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32}
        NGINX_BASE_IMAGE: ${LOCAL_NGINX_BASE_IMAGE:-docker.1ms.run/library/nginx:1.30-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3}
  backend:
    build:
      args:
        BACKEND_BASE_IMAGE: ${LOCAL_BACKEND_BASE_IMAGE:-docker.1ms.run/library/python:3.12-alpine3.24@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89}
  worker-media: &video-worker
    build:
      args:
        BACKEND_BASE_IMAGE: ${LOCAL_BACKEND_BASE_IMAGE:-docker.1ms.run/library/python:3.12-alpine3.24@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89}
  worker-wan: *video-worker
  worker-seedance: *video-worker
  worker-image:
    build:
      args:
        BACKEND_BASE_IMAGE: ${LOCAL_BACKEND_BASE_IMAGE:-docker.1ms.run/library/python:3.12-alpine3.24@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89}
  worker-export:
    build:
      args:
        BACKEND_BASE_IMAGE: ${LOCAL_BACKEND_BASE_IMAGE:-docker.1ms.run/library/python:3.12-alpine3.24@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89}
  worker-chat:
    build:
      args:
        BACKEND_BASE_IMAGE: ${LOCAL_BACKEND_BASE_IMAGE:-docker.1ms.run/library/python:3.12-alpine3.24@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89}
  worker-storyboard:
    build:
      args:
        BACKEND_BASE_IMAGE: ${LOCAL_BACKEND_BASE_IMAGE:-docker.1ms.run/library/python:3.12-alpine3.24@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89}
  postgres:
    image: ${LOCAL_POSTGRES_IMAGE:-docker.1ms.run/library/postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d}
  redis:
    image: ${LOCAL_REDIS_IMAGE:-docker.1ms.run/library/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499}
